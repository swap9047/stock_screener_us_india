name: Check Gemini keys

# By hand only (owner, 2026-11-26): "are all my Gemini keys loaded, and does each one answer?". The
# gemini-keys action finds every GEMINI_API_KEY* secret by name, then each key makes one tiny
# gemini-3.5-flash-lite call (a few dozen tokens). Run it after adding a key. Loads no data, commits
# nothing, and prints key NAMES only, never a value.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export the Gemini keys
        uses: ./.github/actions/gemini-keys
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Try each key
        shell: bash
        run: python -u .github/actions/gemini-keys/check_keys.py 2>&1 | python -u log_redact.py
