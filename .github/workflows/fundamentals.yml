name: Daily Fundamental Views Generation

# A manual run given `markets` or `limit` is titled "partial run", which the slot
# gate (slot_gate.PARTIAL_RUN_TITLE) never counts as the slot's work -- otherwise
# one tab's "Re-analyze All" could stand in for the night's full run. The title is
# fixed text on purpose: the inputs themselves name watchlists, and this repo's
# run list is public.
run-name: ${{ (github.event.inputs.markets || github.event.inputs.limit || github.event.inputs.pending_only == 'true') && 'partial run' || github.workflow }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# AI Fundamental Views for all tickers, once per 9:00 PM ET slot. It reads
# data_snapshot.json rather than refreshing it, and at 9 PM ET the freshest copy
# is the hourly data-refresh's (US close is 4 PM ET, India's session has not
# opened). expert-views.yml refreshes its own copy at the same 9 PM ET slot since 2026-11-26
# (it ran at 1 AM ET before); Sentiment never waits for it.
on:
  # No GitHub schedule (owner, 2026-11-02): the Cloudflare Worker (cloudflare/worker.js) dispatches this
  # workflow with scheduled=true at its slot and hourly for 8 hours after it as a retry; the slot gate
  # below skips a slot that is already done.
  # `markets` lets the dashboard's "Re-analyze All" button scope a run to just
  # the watchlist(s) behind the tab it was clicked from, instead of always
  # re-running every watchlist. Blank (and every scheduled run) = all.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the Cloudflare Worker (owner, 2026-11-02): go through the slot gate and behave exactly like a scheduled run. Leave false when running by hand: a manual run bypasses the gate."
        type: boolean
        required: false
        default: false
      markets:
        description: "Comma-separated watchlist POSITIONS, 1-based in markets.json order, e.g. 2,5 (blank = all watchlists). Positions, never names: step env is printed in this public repo's logs"
        required: false
        default: ""
      limit:
        description: "Analyse only the first N tickers in scope (blank = all). A number, never ticker names: step env is printed in this public repo's logs"
        required: false
        default: ""
      pending_only:
        description: "Only the tickers whose stored view is pending or failed (the app's Retry Pending, owner 2026-11-08). A switch, not a list: the job finds them itself, so no ticker name reaches this public repo's logs"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "21"
          grace-hours: "22"
          work-job: build
          workflow-file: fundamentals.yml
          # A Worker dispatch (scheduled=true) goes through the gate like a schedule would.
          scheduled: ${{ github.event.inputs.scheduled }}
          token: ${{ github.token }}

  build:
    needs: gate
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.scheduled != 'true') || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # GitHub's full 6h cap for a hosted runner -- written out rather than left
    # implicit so it is visibly a decision, not an oversight.
    #
    # This was 240, and a normal run uses 186-201 min of it (~110 tickers x up to
    # 5 LLM calls at a 120s timeout, plus retry pacing). At 78-84% of budget an
    # ordinary bad day crosses the line: on 2026-09-16 two runs were killed at
    # 240 and 241 min, the second having already finished all 121 tickers. The
    # slot took three attempts instead of one.
    #
    # A ceiling is not a reservation -- a run that takes 200 min still takes 200
    # min and bills 200. Raising it only changes what happens on a bad day.
    #
    # (An earlier note here said such a kill lands BEFORE the commit step. It
    # doesn't: that step is `if: always()`, so a killed run still commits its
    # partial results -- which is why those two cancellations cost time and API
    # spend but no data.)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI Fundamental Views
        shell: bash
        run: python -u refresh_fundamentals.py 2>&1 | python -u log_redact.py
        env:
          # The Gemini keys, one line each. GitHub holds back a workflow that serialises the whole secrets
          # context, so they cannot be found by name here. llm_util finds them by prefix; a secret that is
          # not set comes through blank and is ignored, so a new key needs only its secret while it is named
          # here (spare slots through _B9). checks/test_gemini_keys_workflows.py keeps every list identical.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GEMINI_API_KEY_BACKUP_B: ${{ secrets.GEMINI_API_KEY_BACKUP_B }}
          GEMINI_API_KEY_BACKUP_B2: ${{ secrets.GEMINI_API_KEY_BACKUP_B2 }}
          GEMINI_API_KEY_BACKUP_B3: ${{ secrets.GEMINI_API_KEY_BACKUP_B3 }}
          GEMINI_API_KEY_BACKUP_B4: ${{ secrets.GEMINI_API_KEY_BACKUP_B4 }}
          GEMINI_API_KEY_BACKUP_B5: ${{ secrets.GEMINI_API_KEY_BACKUP_B5 }}
          GEMINI_API_KEY_BACKUP_B6: ${{ secrets.GEMINI_API_KEY_BACKUP_B6 }}
          GEMINI_API_KEY_BACKUP_B7: ${{ secrets.GEMINI_API_KEY_BACKUP_B7 }}
          GEMINI_API_KEY_BACKUP_B8: ${{ secrets.GEMINI_API_KEY_BACKUP_B8 }}
          GEMINI_API_KEY_BACKUP_B9: ${{ secrets.GEMINI_API_KEY_BACKUP_B9 }}
          PYTHONUNBUFFERED: "1"
          # github.event.inputs (not `inputs`) so scheduled runs, which carry
          # no inputs at all, resolve to an empty string = every watchlist.
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}
          REFRESH_LIMIT: ${{ github.event.inputs.limit }}
          REFRESH_PENDING_ONLY: ${{ github.event.inputs.pending_only }}
          # A Worker dispatch (scheduled=true) resumes like a scheduled run: refresh_fundamentals.py
          # reads this next to GITHUB_EVENT_NAME.
          SCHEDULED_DISPATCH: ${{ github.event.inputs.scheduled }}

      - name: Commit updated fundamentals.json
        # always(): commit whatever the run produced even when it failed, so
        # the partial results and any pruning survive for diagnosis.
        if: always()
        uses: ./.github/actions/commit-data
        with:
          files: fundamentals.json
          # Per entry against the copy this job loaded (2026-11-22): the whole file,
          # loaded hours ago, reverted every Sentiment the app or an expert-views run
          # wrote meanwhile.
          entries-merge: fundamentals.json
          message: "Update fundamentals.json [automated]"
