name: Daily Fundamental Views Generation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs once/day at 3:00 AM ET. It generates AI Fundamental Views for all
# tickers, reading data_snapshot.json rather than refreshing it itself.
# Scheduled 4 hours after expert-views.yml's 11:00 PM ET run (which is what
# actually refreshes data_snapshot.json, as its first step) so this workflow
# has a large buffer to guarantee that snapshot is fresh and already
# committed by the time it reads it, rather than racing a 30-minute gap.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 3:00 AM ET during EDT
    - cron: "0 8 * * *"   # 08:00 UTC = 3:00 AM ET during EST
  # `markets` lets the dashboard's "Re-analyze All" button scope a run to just
  # the watchlist(s) behind the tab it was clicked from, instead of always
  # re-running every watchlist. Blank (and every scheduled run) = all.
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated market keys to process (blank = all watchlists)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        name: Is it ~3:00 AM ET right now?
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now_et = datetime.now(ZoneInfo("America/New_York"))

          rule_hour = 3
          cron = os.environ.get("CRON_SCHEDULE")
          
          # Which of the two crons matches the current DST season is the ONLY
          # question here. There used to be a second condition,
          #     hour_diff = min((h - R) % 24, (R - h) % 24)
          #     due = is_valid_cron and (hour_diff <= 22)
          # billed as a tolerance for scheduler delays -- but that expression is
          # a distance on a 24h circle, so it maxes out at 12 and `<= 22` was
          # unconditionally true. It gated nothing. Deliberately not replaced
          # with a working hour window: GitHub can delay a scheduled run, and
          # skipping the refresh entirely is worse than running it late.
          due = True
          if cron:
              try:
                  cron_utc_hour = int(cron.split()[1])
                  expected_utc_hour = int((rule_hour - (now_et.utcoffset().total_seconds() / 3600)) % 24)
                  due = cron_utc_hour == expected_utc_hour
              except Exception as e:
                  # Was `pass`, which left due=True -- so an unparseable cron
                  # fired BOTH scheduled lines and double-ran ~110 tickers.
                  print(f"# could not parse CRON_SCHEDULE {cron!r}: {e}")
                  due = False
          
          print(f"due={'true' if due else 'false'}")
          EOF

  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    # ~110 tickers x up to 5 LLM calls at a 120s timeout, plus retry
    # pacing. Unbounded, the worst case creeps toward GitHub's 6h cap and
    # is killed AFTER the API spend but BEFORE the commit step.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI Fundamental Views
        run: python -u refresh_fundamentals.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          # github.event.inputs (not `inputs`) so scheduled runs, which carry
          # no inputs at all, resolve to an empty string = every watchlist.
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}

      - name: Commit updated fundamentals.json
        # always(): commit whatever the run produced even when it failed, so
        # the partial results and any pruning survive for diagnosis.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json
          if ! git diff --staged --quiet; then
            git commit -m "Update fundamentals.json [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi
