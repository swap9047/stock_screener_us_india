name: Market Read Writer

# The News tab's "market read" (owner, 2026-10-31): a few sentences per index on what
# its breadth, highs/lows, drawdown and list-vs-index charts say, written by Gemini
# from facts computed in code (market_read.py) and shown behind the (i) button above
# the charts. Twice a day, after each market's close and once the breadth job has
# stored the final reading: 7:15 AM ET (NSE closed ~6 AM) and 5:15 PM ET (US closed
# 4 PM). Only Nifty 500 and the S&P 500 get an index read, and India Invested and US Invested
# (the Watchlist Breadth panels) a list read with key takeaways (owner, 2026-10-31). Their latest final session
# is written once, whichever slot finds it
# missing, so a late or repeated run costs nothing.
on:
  # ONE hourly wake-up at :15, not a cron per DST season; the slot gate decides
  # whether this run does the work (see the other workflows).
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also write this many earlier sessions that have no read yet (a number; 0 = just the latest)"
        required: false
        default: "0"
      force:
        description: "Write the latest session's read again even if it exists"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's run history; the wait step lists the breadth runs

jobs:
  # Two slots, weekdays: 7 AM and 5 PM ET. grace-hours 23 (owner, 2026-10-31): the gate
  # always works the LATEST slot, so a run starting any time before the next slot still
  # does a slot that was missed or failed (GitHub starts scheduled runs late and drops
  # some), once a run's work job has succeeded the slot is done, and the next slot
  # takes over. A run that fails (every model down, or a reading still forming) is
  # retried by each hourly wake-up until then.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "7,17"
          grace-hours: "23"
          days: "MON,TUE,WED,THU,FRI"
          work-job: write_reads
          workflow-file: market-read.yml
          token: ${{ github.token }}

  write_reads:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The breadth job (market-breadth.yml) is dispatched at the top of the hour and takes
      # ~10 minutes; the reads need its final reading, so wait here (up to 30 minutes) while
      # one is queued or running. Before load-data on purpose: that step copies the data
      # repo's files in, and they must include what that run commits. A failed API call
      # counts as "none running" -- the script then reads whatever is stored, and exits 1
      # if the reading is still forming, which the slot gate retries.
      - name: Wait for a running breadth refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            busy=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/market-breadth.yml/runs?per_page=10" \
                   --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null || echo 0)
            if [ "${busy:-0}" = "0" ]; then
              echo "No breadth refresh running."
              exit 0
            fi
            echo "A breadth refresh is running; waiting a minute (${i}/30)..."
            sleep 60
          done
          echo "Still running after 30 minutes; going on with what is stored."

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The script exits 1 when a reading is still forming or every model failed on a
      # read; `shell: bash` runs with pipefail, so the pipe through log_redact.py keeps
      # that exit code. Counts only: a read describes the invested list.
      - name: Write the market reads
        shell: bash
        run: |
          python -u refresh_market_read.py 2>&1 | python -u log_redact.py
        env:
          MARKET_READ_BACKFILL: ${{ github.event.inputs.backfill }}
          MARKET_READ_FORCE: ${{ github.event.inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # More keys: Actions only exposes secrets a step names, so each key needs a
          # line here; llm_util discovers them by name prefix. A secret that isn't set
          # comes through blank and is ignored.
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GEMINI_API_KEY_BACKUP_B: ${{ secrets.GEMINI_API_KEY_BACKUP_B }}
          GEMINI_API_KEY_BACKUP_B2: ${{ secrets.GEMINI_API_KEY_BACKUP_B2 }}
          GEMINI_API_KEY_BACKUP_B3: ${{ secrets.GEMINI_API_KEY_BACKUP_B3 }}
          GEMINI_API_KEY_BACKUP_B4: ${{ secrets.GEMINI_API_KEY_BACKUP_B4 }}

      # always(): reads written before a failure are kept; the job still reports red.
      - name: Commit updated market_read.json
        if: always()
        uses: ./.github/actions/commit-data
        with:
          files: market_read.json
          message: "Update market reads [automated]"

      # The reads for Claude chat too (owner, 2026-10-31): the same text goes into the research library's
      # database, where the connector's get_market_read tool serves it. After the commit, and
      # continue-on-error: the library's copy must never cost the data repo's. always(): reads written before a
      # failure (every read is saved as it is made) are published as well. Counts only in the log.
      - name: Publish the reads to the research library
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          pip install --quiet "psycopg[binary]~=3.3"
          python -u publish_market.py reads 2>&1 | python -u log_redact.py
        env:
          MARKET_DB_URL: ${{ secrets.MARKET_DB_URL }}
