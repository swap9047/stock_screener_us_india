name: Weekly Wrap-up

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs once a week, Sunday 9:00 PM ET -- the same hour as the daily alert
# check (alerts.ALLOWED_HOURS), and ~6:30 AM IST Monday, so the digest lands
# just before the India open. On a Sunday evening the snapshot is Friday's
# close, which is exactly the end-of-week status the wrap-up reports.
#
# The wake-up is hourly and the gate job below picks the run that owns the
# Sunday 21:00 ET slot, so neither UTC day-of-week arithmetic nor a cron per DST
# season is needed (same pattern as daily-alerts.yml).
on:
  # ONE hourly wake-up, not a cron per DST season. The slot gate below decides
  # whether this run does the work, so a line GitHub never fires (it dropped the
  # 9:15 PM ET alert line on 2026-09-14) or fires 5 h late no longer costs a slot.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}   # run manually from the Actions tab anytime, bypasses the gate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  # Does this run own the current slot? See .github/actions/slot-gate.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "21"
          grace-hours: "22"
          days: "SUN"
          work-job: wrapup
          workflow-file: weekly-wrapup.yml
          token: ${{ github.token }}

  wrapup:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly wrap-up and send to Discord
        shell: bash
        run: python -u weekly_wrapup_check.py 2>&1 | python -u log_redact.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # weekly_wrapup_state.json is committed rather than cached: it is the
      # only record of when each ticker entered each alert, and losing it
      # (cache eviction) would silently reset every Wk to 0. It is
      # deliberately NOT in github_sync.SYNCABLE_FILES -- the app must never
      # be able to push a stale local copy over this one.
      - name: Commit updated weekly_wrapup_state.json
        uses: ./.github/actions/commit-data
        with:
          files: weekly_wrapup_state.json
          message: "Update weekly_wrapup_state.json [automated]"
