name: Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# The offline checks (checks/run_all.py). They exist because this repo has no
# test framework and its failures have historically been silent: a workflow goes
# green while the data goes wrong. They need no secrets, no network and no data
# files, so they run on every push -- including from a fork, where secrets are
# not available.
#
# They include headless renders of the app (streamlit's AppTest, over invented
# fixtures) and run cloudflare/worker.js under node. What they do NOT cover, by
# design: anything needing real prices, the private data repo or a live GitHub
# API (renders over the real snapshot, the end-to-end edit test, the job
# simulation). Those are run by hand -- see checks/README.md.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Two suites run the real cloudflare/worker.js under node and SKIP without
      # it; on CI test_refresh_schedule.py fails instead, so the Worker checks
      # cannot quietly stop running. Node 22: 20 reached end of life in 2026-04.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pinned set from requirements.txt, so a check runs against what the
      # scheduled workflows and Streamlit Cloud actually install.
      - name: Install dependencies
        run: pip install -r requirements.txt -r checks/requirements.txt

      - name: Offline checks
        run: python3 checks/run_all.py

      # Cheap and catches a whole class of mistake the checks cannot: a YAML or
      # shell error in a workflow only shows up when that workflow next runs.
      - name: Compile every module
        run: python3 -m compileall -q *.py checks/*.py .github/actions/slot-gate/slot_gate.py

      - name: Parse every workflow and action
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/**/*.yml", recursive=True)):
              try:
                  yaml.safe_load(open(path))
              except Exception as e:
                  print(f"::error file={path}::{e}"); bad += 1
          print(f"parsed {len(glob.glob('.github/**/*.yml', recursive=True))} file(s), {bad} bad")
          sys.exit(1 if bad else 0)
          EOF
