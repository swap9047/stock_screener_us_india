name: Daily Watchlist News Summary

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs once/day at 8:00 PM ET (after market close), building a Gemini
# grounded-search news digest (major announcements/developments/stock moves
# in the last 24h) for each watchlist and sending it to Discord.
#
# 8:00 PM ET is 00:00 UTC during EDT (mid-Mar to early Nov) and 01:00 UTC
# during EST (early Nov to mid-Mar) -- GitHub Actions cron is UTC-only and
# does NOT adjust for daylight saving, so both lines are scheduled and a
# cheap "gate" job checks the real America/New_York wall-clock hour at run
# time so only the correct one for the current season actually proceeds
# (mirrors the same DST pattern used in daily-alerts.yml).
on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 8:00 PM ET during EDT
    - cron: "0 1 * * *"   # 01:00 UTC = 8:00 PM ET during EST
  workflow_dispatch: {}    # run manually from the Actions tab anytime, bypasses the gate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit news_summary.json back to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        name: Is it ~8 PM ET right now?
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          # Which of the two crons is the right one for the current DST season
          # is the ONLY question here. There used to be a second condition,
          #     hour_diff = min((h - 20) % 24, (20 - h) % 24)
          #     due = is_valid_cron and (hour_diff <= 22)
          # described as a "22 hour tolerance for scheduler delays" -- but that
          # expression is a distance on a 24h circle and so maxes out at 12,
          # making `<= 22` unconditionally true. It gated nothing and only
          # obscured the cron match, which does the real work. Deliberately not
          # replaced with a working hour window: GitHub can delay a scheduled
          # run substantially, and skipping the digest entirely is worse than
          # running it late.
          import os
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now_et = datetime.now(ZoneInfo("America/New_York"))

          rule_hour = 20
          cron = os.environ.get("CRON_SCHEDULE")

          # No cron in the env means this wasn't a scheduled run (the build job
          # lets workflow_dispatch through regardless), so default to due.
          due = True
          if cron:
              try:
                  cron_utc_hour = int(cron.split()[1])
                  expected_utc_hour = int((rule_hour - (now_et.utcoffset().total_seconds() / 3600)) % 24)
                  due = cron_utc_hour == expected_utc_hour
              except Exception as e:
                  # Was `pass`, which left due=True -- so an unparseable cron
                  # made BOTH scheduled lines fire and double-ran the digest.
                  print(f"# could not parse CRON_SCHEDULE {cron!r}: {e}")
                  due = False

          print(f"due={'true' if due else 'false'}")
          EOF

  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    # ~105 tickers x up to 5 LLM calls at a 120s timeout, plus the retry
    # queue's 30s-per-ticker pacing. Without a bound the worst case creeps
    # toward the 6-hour hard cap and gets killed AFTER the API spend but
    # BEFORE the commit step, losing the whole run's work.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build news summary and send to Discord
        run: python -u news_check.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Second key so llm_util.make_client can spread the run's calls
          # across both projects' quotas -- see llm_util's rotation section.
          # Absent/blank is fine: rotation just falls back to one key.
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # always(): news_check.py now exits non-zero when most tickers failed
      # their search, and the counters recording exactly that live in the JSON
      # it already wrote. Commit it either way so the failure is diagnosable;
      # the job still reports red.
      - name: Commit updated news_summary.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_summary.json
          if ! git diff --staged --quiet; then
            git commit -m "Update news_summary.json [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi
