name: Daily Watchlist News Summary

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Does its work once per 8:00 PM ET slot, building a Gemini grounded-search news
# digest (major announcements/developments/stock moves in the last 24h) for each
# watchlist and sending it to Discord. The slot gate keeps that to one run a day.
on:
  # ONE hourly wake-up, not a cron per DST season. The slot gate below decides
  # whether this run does the work, so a line GitHub never fires (it dropped the
  # 9:15 PM ET alert line on 2026-09-14) or fires 5 h late no longer costs a slot.
  schedule:
    - cron: "0 * * * *"
  # Run manually from the Actions tab anytime, bypasses the gate. `markets` and
  # `limit` make it a partial smoke-test run: only those watchlists' first N
  # tickers, only their digests replaced, and nothing posted to Discord (see
  # news_check.py). Blank (and every scheduled run) = the normal full digest.
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated market keys (blank = the news scope in settings)"
        required: false
        default: ""
      limit:
        description: "Analyse only the first N tickers in scope (blank = all). A number, never ticker names: step env is printed in this public repo's logs"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "20"
          grace-hours: "22"
          work-job: build
          workflow-file: news-summary.yml
          token: ${{ github.token }}

  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # GitHub's full 6h for a hosted runner, matching fundamentals and
    # expert-views. This was 180 on the basis that the job runs ~54 minutes --
    # and on 2026-09-17 it was killed at exactly 180. Its tickers were done at
    # 61 minutes; the other two hours were the process unable to EXIT, because
    # a timed-out Gemini call left a non-daemon worker that atexit joined (see
    # llm_util.generate_with_timeout). That cause is fixed at the root now; the
    # ceiling goes up because it is the backstop, and 180 had no headroom the
    # moment anything went slowly.
    #
    # A ceiling is not a reservation: a 60-minute run still takes and bills 60.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build news summary and send to Discord
        shell: bash
        run: python -u news_check.py 2>&1 | python -u log_redact.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Second key so llm_util.make_client can spread the run's calls
          # across both projects' quotas -- see llm_util's rotation section.
          # Absent/blank is fine: rotation just falls back to one key.
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          # A third key (2026-09-16). Actions only exposes secrets a step names, so
          # each new key needs a line here; llm_util discovers it by name prefix.
          GEMINI_API_KEY_BACKUP_B: ${{ secrets.GEMINI_API_KEY_BACKUP_B }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}
          REFRESH_LIMIT: ${{ github.event.inputs.limit }}

      # always(): news_check.py now exits non-zero when most tickers failed
      # their search, and the counters recording exactly that live in the JSON
      # it already wrote. Commit it either way so the failure is diagnosable;
      # the job still reports red.
      - name: Commit updated news_summary.json
        if: always()
        uses: ./.github/actions/commit-data
        with:
          files: news_summary.json
          message: "Update news_summary.json [automated]"
