name: Daily Watchlist News Summary

# A manual run given `markets` or `limit` is titled "partial run", which the slot
# gate (slot_gate.PARTIAL_RUN_TITLE) never counts as the slot's work -- otherwise
# one tab's "Re-analyze All" could stand in for the night's full run. The title is
# fixed text on purpose: the inputs themselves name watchlists, and this repo's
# run list is public.
run-name: ${{ (github.event.inputs.markets || github.event.inputs.limit) && 'partial run' || github.workflow }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Does its work once per slot, building a Gemini grounded-search news digest (major
# announcements/developments/stock moves in the last 7 days) for each watchlist and
# sending it to Discord. Sunday and Wednesday at 6 PM ET only (owner, 2026-11-26: before
# Sunday evening and Wednesday evening; it was 6 AM ET every day, and 8 PM ET before
# 2026-10-08): the gate's `days` is the SLOT's weekday, the Worker dispatches only those
# slots and their hourly retries. 23 h grace: a late start still does the slot.
on:
  # No GitHub schedule (owner, 2026-11-02): the Cloudflare Worker (cloudflare/worker.js) dispatches this
  # workflow with scheduled=true at its slot and hourly for 8 hours after it as a retry; the slot gate
  # below skips a slot that is already done.
  # Run manually from the Actions tab anytime, bypasses the gate. `markets` and
  # `limit` make it a partial smoke-test run: only those watchlists' first N
  # tickers, only their digests replaced, and nothing posted to Discord (see
  # news_check.py). Blank (and every scheduled run) = the normal full digest.
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the Cloudflare Worker (owner, 2026-11-02): go through the slot gate and behave exactly like a scheduled run. Leave false when running by hand: a manual run bypasses the gate."
        type: boolean
        required: false
        default: false
      markets:
        description: "Comma-separated watchlist POSITIONS, 1-based in markets.json order, e.g. 2,5 (blank = the news scope in settings). Positions, never names: step env is printed in this public repo's logs"
        required: false
        default: ""
      limit:
        description: "Analyse only the first N tickers in scope (blank = all). A number, never ticker names: step env is printed in this public repo's logs"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "18"
          days: "SUN,WED"
          grace-hours: "23"
          work-job: build
          workflow-file: news-summary.yml
          # A Worker dispatch (scheduled=true) goes through the gate like a schedule would.
          scheduled: ${{ github.event.inputs.scheduled }}
          token: ${{ github.token }}

  build:
    needs: gate
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.scheduled != 'true') || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # GitHub's full 6h for a hosted runner, matching fundamentals and
    # expert-views. This was 180 on the basis that the job runs ~54 minutes --
    # and on 2026-09-17 it was killed at exactly 180. Its tickers were done at
    # 61 minutes; the other two hours were the process unable to EXIT, because
    # a timed-out Gemini call left a non-daemon worker that atexit joined (see
    # llm_util.generate_with_timeout). That cause is fixed at the root now; the
    # ceiling goes up because it is the backstop, and 180 had no headroom the
    # moment anything went slowly.
    #
    # A ceiling is not a reservation: a 60-minute run still takes and bills 60.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build news summary and send to Discord
        shell: bash
        run: python -u news_check.py 2>&1 | python -u log_redact.py
        env:
          # The Gemini keys, one line each. GitHub holds back a workflow that serialises the whole secrets
          # context, so they cannot be found by name here. llm_util finds them by prefix; a secret that is
          # not set comes through blank and is ignored, so a new key needs only its secret while it is named
          # here (spare slots through _B9). checks/test_gemini_keys_workflows.py keeps every list identical.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GEMINI_API_KEY_BACKUP_B: ${{ secrets.GEMINI_API_KEY_BACKUP_B }}
          GEMINI_API_KEY_BACKUP_B2: ${{ secrets.GEMINI_API_KEY_BACKUP_B2 }}
          GEMINI_API_KEY_BACKUP_B3: ${{ secrets.GEMINI_API_KEY_BACKUP_B3 }}
          GEMINI_API_KEY_BACKUP_B4: ${{ secrets.GEMINI_API_KEY_BACKUP_B4 }}
          GEMINI_API_KEY_BACKUP_B5: ${{ secrets.GEMINI_API_KEY_BACKUP_B5 }}
          GEMINI_API_KEY_BACKUP_B6: ${{ secrets.GEMINI_API_KEY_BACKUP_B6 }}
          GEMINI_API_KEY_BACKUP_B7: ${{ secrets.GEMINI_API_KEY_BACKUP_B7 }}
          GEMINI_API_KEY_BACKUP_B8: ${{ secrets.GEMINI_API_KEY_BACKUP_B8 }}
          GEMINI_API_KEY_BACKUP_B9: ${{ secrets.GEMINI_API_KEY_BACKUP_B9 }}
          # Or every key in ONE secret, separated by commas (owner, 2026-11-26): llm_util splits it, and a secret that
          # is not set comes through blank. log_redact masks each key of the list on its own.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}
          REFRESH_LIMIT: ${{ github.event.inputs.limit }}

      # always(): news_check.py now exits non-zero when most tickers failed
      # their search, and the counters recording exactly that live in the JSON
      # it already wrote. Commit it either way so the failure is diagnosable;
      # the job still reports red.
      - name: Commit updated news_summary.json
        if: always()
        uses: ./.github/actions/commit-data
        with:
          files: news_summary.json
          message: "Update news_summary.json [automated]"
