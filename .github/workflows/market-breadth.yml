name: Market Breadth Updater

on:
  # ONE hourly wake-up, not four cron lines across two DST seasons. The gate job
  # decides which of the two daily slots (10 AM / 10 PM ET) this run owns.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  # Once per 10 AM / 10 PM ET slot, Mon-Sat. 10 h window: it must stay below the
  # 12 h between slots, or a late run could no longer tell which slot it owns.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "10,22"
          grace-hours: "10"
          days: "MON,TUE,WED,THU,FRI,SAT"
          work-job: update_breadth
          workflow-file: market-breadth.yml
          token: ${{ github.token }}

  update_breadth:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculate Market Breadth
        shell: bash
        run: |
          python -u refresh_market_breadth.py 2>&1 | python -u log_redact.py

      - name: Refresh Dashboard Performance Data
        shell: bash
        run: |
          python -u refresh_dashboard_perf.py 2>&1 | python -u log_redact.py

      - name: Commit and push changes
        uses: ./.github/actions/commit-data
        with:
          files: market_breadth.json dashboard_perf.json
          message: "Update market breadth & dashboard performance data [automated]"

      # Runs AFTER the commit on purpose. A leg that fails still leaves the
      # other market refreshed and worth committing, and refresh_market_breadth.py
      # exits 0 so those steps run -- so this is the only place a failure becomes
      # visible. Without it, 8 consecutive runs reported "success" while the S&P
      # 500 breadth charts were blank.
      - name: Verify every market refreshed
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("market_breadth.json") as f:
              data = json.load(f)
          status = data.get("status") or {}
          failed = sorted(k for k, v in status.items() if v != "ok")
          missing = sorted({"US", "INDIA"} - set(status))
          if failed or missing:
              print(f"::error::Market breadth incomplete -- failed: {failed or 'none'}, "
                    f"missing from status: {missing or 'none'}")
              sys.exit(1)
          print(f"All markets refreshed: {sorted(status)}")
          EOF
