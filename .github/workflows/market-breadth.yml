name: Market Breadth Updater

on:
  schedule:
    # Run at 10:00 PM ET (after market close, before Expert Views at 11PM)
    # Eastern is UTC-4 (summer) or UTC-5 (winter).
    # 03:00 UTC = 11:00 PM EDT or 10:00 PM EST. Let's use 02:00 UTC for DST 10PM / EST 9PM
    - cron: '0 2 * * 2-6' # Tue-Sat 02:00 UTC (Mon-Fri 10PM EDT)
    - cron: '0 3 * * 2-6' # Tue-Sat 03:00 UTC (Mon-Fri 10PM EST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_breadth:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check Timezone / Duplicate Run Guard
        id: time_check
        run: |
          # Gate logic for DST:
          # If it's DST (EDT), UTC is 4 hours ahead. 10PM EDT = 2:00 AM UTC.
          # If it's Standard (EST), UTC is 5 hours ahead. 10PM EST = 3:00 AM UTC.
          is_dst() {
            local date_str=$(TZ="America/New_York" date '+%Z')
            if [ "$date_str" = "EDT" ]; then return 0; else return 1; fi
          }
          current_utc_hour=$(date -u +%H)
          if is_dst; then
            if [ "$current_utc_hour" -eq "03" ]; then
              echo "It is DST. The 03:00 UTC run is skipped (it already ran at 02:00)."
              exit 0
            fi
          else
            if [ "$current_utc_hour" -eq "02" ]; then
              echo "It is Standard Time. The 02:00 UTC run is skipped (will run at 03:00)."
              exit 0
            fi
          fi
          echo "Proceeding with run."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculate Market Breadth
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u refresh_market_breadth.py

      - name: Commit and push changes
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_breadth.json
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "Update market breadth [automated]" && git pull --rebase && git push)
