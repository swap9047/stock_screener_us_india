name: Market Breadth Updater

on:
  schedule:
    # Runs at 10:00 PM ET (after market close, before Expert Views at 11PM)
    # and 10:00 AM ET (mid-session). Eastern is UTC-4 (EDT) or UTC-5 (EST),
    # so the cron covers both offsets (02/03 UTC = 10PM, 14/15 UTC = 10AM)
    # and the time_check gate keeps only the runs on an allowed ET slot.
    - cron: "0 2,3,14,15 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_breadth:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check Timezone / Slot Guard
        id: time_check
        run: |
          # Dedupe the dual-offset cron AND enforce the 10 AM / 10 PM ET slots
          # (Mon-Sat) regardless of DST, using America/New_York wall-clock time.
          run_slot=$(TZ="America/New_York" date '+%H %u')
          hour=${run_slot% *}
          day=${run_slot#* }
          if [ "$day" -gt 6 ]; then
            echo "Sunday - no market breadth run."
            exit 0
          fi
          case "$hour" in
            10|22)
              echo "Proceeding with run."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Not an allowed ET slot ($hour)."
              ;;
          esac

      - name: Install dependencies
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculate Market Breadth
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u refresh_market_breadth.py

      - name: Refresh Dashboard Performance Data
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u refresh_dashboard_perf.py

      - name: Commit and push changes
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_breadth.json dashboard_perf.json
          if ! git diff --staged --quiet; then
            git commit -m "Update market breadth & dashboard performance data [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi
