name: Market Breadth Updater

on:
  schedule:
    # Runs at 10:00 AM and 10:00 PM ET, Mon-Sat. Eastern is UTC-4 (EDT) or
    # UTC-5 (EST), so the cron covers both offsets (02/03 UTC = 10PM,
    # 14/15 UTC = 10AM). The time_check gate keeps only the runs whose
    # current ET time lands within a slot; a 6-hour grace window past each
    # slot absorbs GitHub's schedule delays, and an is_valid_cron filter
    # keeps exactly two in-season fires per day (10 AM and 10 PM ET).
    - cron: "0 2,3,14,15 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_breadth:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check Timezone / Slot Guard
        id: time_check
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Keep only runs whose current ET time lands within the 10 AM / 10 PM
          # ET slots (Mon-Sat), regardless of DST. A 6-hour grace window past
          # each slot absorbs GitHub's schedule delays, and an is_valid_cron
          # check filters the dual-offset cron down to the two in-season fires
          # per day so the run fires once per slot, not twice.
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now_et = datetime.now(ZoneInfo("America/New_York"))

          slots = {10, 22}                 # 10 AM and 10 PM ET
          grace_h = 6                      # tolerate GitHub schedule delays
          cron = os.environ.get("CRON_SCHEDULE")

          is_valid_cron = True
          if cron:
              try:
                  cron_utc_hours = {int(h) for h in cron.split()[1].split(',')}
                  expected_utc_hours = {int((slot - (now_et.utcoffset().total_seconds() / 3600)) % 24) for slot in slots}
                  if not cron_utc_hours & expected_utc_hours:
                      is_valid_cron = False
              except Exception:
                  pass

          now_minutes = now_et.hour * 60 + now_et.minute
          run = (is_valid_cron and now_et.isoweekday() <= 6 and
                 any(s <= now_minutes < s + grace_h * 60
                     for s in (slot * 60 for slot in slots)))

          print(f"run={'true' if run else 'false'}")
          EOF

      - name: Install dependencies
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculate Market Breadth
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u refresh_market_breadth.py

      - name: Refresh Dashboard Performance Data
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u refresh_dashboard_perf.py

      - name: Commit and push changes
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_breadth.json dashboard_perf.json
          if ! git diff --staged --quiet; then
            git commit -m "Update market breadth & dashboard performance data [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi

      # Runs AFTER the commit on purpose. A leg that fails still leaves the
      # other market refreshed and worth committing, and refresh_market_breadth.py
      # exits 0 so those steps run -- so this is the only place a failure becomes
      # visible. Without it, 8 consecutive runs reported "success" while the S&P
      # 500 breadth charts were blank.
      - name: Verify every market refreshed
        if: steps.time_check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("market_breadth.json") as f:
              data = json.load(f)
          status = data.get("status") or {}
          failed = sorted(k for k, v in status.items() if v != "ok")
          missing = sorted({"US", "INDIA"} - set(status))
          if failed or missing:
              print(f"::error::Market breadth incomplete -- failed: {failed or 'none'}, "
                    f"missing from status: {missing or 'none'}")
              sys.exit(1)
          print(f"All markets refreshed: {sorted(status)}")
          EOF
