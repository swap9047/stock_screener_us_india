name: Daily Stock Alerts

# *** CURRENTLY RUNNING ONCE/DAY AT 10:00 PM ET ONLY (hourly disabled) ***
# alerts.ALLOWED_HOURS still supports picking ANY of the 24 hours per rule
# in the app (that part of the architecture is unchanged) -- but until this
# workflow is switched back to hourly (`cron: "0 * * * *"`, see git history
# for the exact line), ONLY rules scheduled for 10:00 PM ET will actually
# get checked, since that's the only hour this workflow wakes up. Any rule
# saved with a different hour will just sit there un-checked until either
# it's moved to 10:00 PM or the workflow is widened again.
#
# 10:00 PM ET is 02:00 UTC (next day) during EDT (mid-Mar to early Nov) and
# 03:00 UTC (next day) during EST (early Nov to mid-Mar) -- GitHub Actions
# cron is UTC-only and does NOT adjust for daylight saving, so both lines
# are scheduled and is_rule_due() checks the real America/New_York
# wall-clock hour at run time to only actually act on the correct one for
# the current season.
#
# Cost control: a cheap "gate" job runs first -- it only installs
# `requests` (the one third-party dependency alerts.py itself needs) and
# asks is_rule_due() whether anything is actually due right now. The
# expensive "check" job (installs streamlit/yfinance/pandas and fetches
# live prices) only runs when the gate says yes.
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 10:00 PM ET during EDT
    - cron: "0 3 * * *"   # 03:00 UTC = 10:00 PM ET during EST
  workflow_dispatch: {}   # run manually from the Actions tab anytime, bypasses the gate

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps for schedule check
        run: pip install requests

      - id: check
        name: Is any enabled rule due right now?
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from alerts import load_rules, is_rule_due
          rules = load_rules()
          due = any(r.get("enabled", True) and r.get("conditions") and is_rule_due(r) for r in rules)
          print(f"due={'true' if due else 'false'}")
          EOF

  check:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore alert_state.json from cache so we don't re-fire alerts
      # that already fired in a previous run (edge-triggered dedup)
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        run: python alert_check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Save updated alert_state.json so next run picks it up
      - name: Save alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
