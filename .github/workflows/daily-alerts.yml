name: Daily Stock Alerts

# *** TEMPORARILY RUNNING EVERY 15 MIN FOR TESTING ***
# The gate's is_rule_due() check and the 12pm/9pm restriction are both
# bypassed right now (gate forced to due=true, check job runs with
# --force) so you can see live Discord alerts fire quickly. This burns
# GitHub Actions minutes much faster than the normal 2x/day schedule --
# revert to the commented-out 4-line cron + restore the real gate check +
# drop --force once testing is done.
#
# Each alert rule carries its OWN day + time-of-day schedule (see the Alert
# Rules tab in the app, and alerts.is_rule_due) -- but to keep GitHub
# Actions usage low, every rule's time is restricted to just 2 choices:
# 12:00 PM (noon) or 9:00 PM ET (see alerts.ALLOWED_HOURS). This workflow
# runs at exactly those 2 ET times per day, not continuously.
#
# GitHub Actions cron is UTC-only and does NOT adjust for daylight saving,
# so "noon ET" is 16:00 UTC during EDT (mid-Mar to early Nov) but 17:00 UTC
# during EST (early Nov to mid-Mar) -- and likewise 9pm ET is 01:00 UTC
# (next day) during EDT but 02:00 UTC during EST. A fixed single cron per
# target time would silently drift an hour off twice a year, so instead we
# schedule BOTH possible UTC times for BOTH ET targets (4 cron lines total)
# and let is_rule_due() check the real America/New_York wall-clock hour at
# run time -- the 2 firings that land on the "wrong" season for that target
# simply find nothing due (or nothing beyond the cheap gate job) and exit.
#
# To avoid paying for a full dependency install (streamlit/yfinance/pandas)
# on the "wrong season" firings (or on a real firing where nothing's due
# that day), there's a cheap "gate" job first: it only installs `requests`
# (the one third-party dependency alerts.py itself needs) and asks
# is_rule_due() whether anything is due right now. The expensive "check"
# job (which fetches live prices) only runs when the gate says yes.
on:
  schedule:
    # --- TEMPORARY: testing every 15 min, replace with the 4 lines below when done ---
    - cron: "*/15 * * * *"
    # - cron: "0 16 * * *"   # 16:00 UTC = 12:00 PM ET during EDT
    # - cron: "0 17 * * *"   # 17:00 UTC = 12:00 PM ET during EST
    # - cron: "0 1 * * *"    # 01:00 UTC = 9:00 PM ET during EDT
    # - cron: "0 2 * * *"    # 02:00 UTC = 9:00 PM ET during EST
  workflow_dispatch: {}   # run manually from the Actions tab anytime, bypasses the gate

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps for schedule check
        run: pip install requests

      - id: check
        name: Is any enabled rule due right now?
        run: |
          # TEMPORARY: forced to always "true" while testing every 15 min.
          # Restore the real is_rule_due() check (below) when done testing.
          echo "due=true" >> "$GITHUB_OUTPUT"
          # python - <<'EOF' >> "$GITHUB_OUTPUT"
          # from alerts import load_rules, is_rule_due
          # rules = load_rules()
          # due = any(r.get("enabled", True) and r.get("conditions") and is_rule_due(r) for r in rules)
          # print(f"due={'true' if due else 'false'}")
          # EOF

  check:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore alert_state.json from cache so we don't re-fire alerts
      # that already fired in a previous run (edge-triggered dedup)
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        run: python alert_check.py --force  # TEMPORARY: bypasses per-rule schedule while testing every 15 min
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Save updated alert_state.json so next run picks it up
      - name: Save alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
