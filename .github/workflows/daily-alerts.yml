name: Daily Stock Alerts

# Runs every hour, year-round -- deliberately simple. Each alert rule
# carries its OWN day + hour schedule (any of the 24 hours, ET -- see the
# Alert Rules tab in the app, and alerts.ALLOWED_HOURS/is_rule_due), so this
# workflow just needs to show up every hour and ask "is anything due right
# now?" rather than the workflow itself needing to know which hours matter.
# That means changing a rule's schedule in the app is a pure JSON-config
# change (alerts_config.json, pushed via the "Push config to GitHub" button
# on the Alert Rules tab) -- it never requires editing or re-pushing this
# workflow file, no matter which hour(s) you pick.
#
# This also sidesteps GitHub Actions cron's UTC-only, no-DST-awareness
# problem entirely: since we fire every UTC hour anyway, there's no target
# ET time that could "drift" across a DST boundary the way a once/twice-a-
# day fixed cron would -- is_rule_due() just checks the real
# America/New_York wall-clock hour (via zoneinfo) at run time, which is
# always correct regardless of season.
#
# Cost control: a cheap "gate" job runs every hour first -- it only installs
# `requests` (the one third-party dependency alerts.py itself needs) and
# asks is_rule_due() whether anything is actually due this hour. The
# expensive "check" job (installs streamlit/yfinance/pandas and fetches
# live prices) only runs when the gate says yes. In practice most hours
# find nothing due and exit in well under a minute -- 24 cheap gate
# runs/day plus however many real checks your rules' schedules actually
# need comes in comfortably under GitHub's free 2,000 min/month for a
# private repo (unlimited on a public repo).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}   # run manually from the Actions tab anytime, bypasses the gate

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps for schedule check
        run: pip install requests

      - id: check
        name: Is any enabled rule due right now?
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from alerts import load_rules, is_rule_due
          rules = load_rules()
          due = any(r.get("enabled", True) and r.get("conditions") and is_rule_due(r) for r in rules)
          print(f"due={'true' if due else 'false'}")
          EOF

  check:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore alert_state.json from cache so we don't re-fire alerts
      # that already fired in a previous run (edge-triggered dedup)
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        run: python alert_check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Save updated alert_state.json so next run picks it up
      - name: Save alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
