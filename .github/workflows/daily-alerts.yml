name: Daily Stock Alerts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Alerts for the 9:00 PM ET slot, once a day. The app only offers that hour
# (alerts.ALLOWED_HOURS); to add another, add it there AND to the gate's
# `slots` input below.
#
# The wake-up is hourly and the gate decides which run owns the slot, because a
# cron line is not a promise: on 2026-09-14 GitHub fired only the EST line of
# the old DST pair, the old gate rejected it as the wrong season, and that day's
# alerts never went out.
#
# Cost control: a cheap "gate" job runs first -- it only installs
# `requests` (the one third-party dependency alerts.py itself needs) and
# asks is_rule_due() whether anything is actually due right now. The
# expensive "check" job (installs streamlit/yfinance/pandas and fetches
# live prices) only runs when the gate says yes.
on:
  # ONE hourly wake-up, not a cron per DST season. The slot gate below decides
  # whether this run does the work, so a line GitHub never fires (it dropped the
  # 9:15 PM ET alert line on 2026-09-14) or fires 5 h late no longer costs a slot.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}   # run manually from the Actions tab anytime, bypasses the gate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  # Two questions, cheapest first: does this run own the 9:00 PM ET slot (see
  # .github/actions/slot-gate), and is any enabled rule actually due for that
  # slot's day? The heavy check job (streamlit/yfinance/pandas + live prices)
  # only starts when both say yes.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "21"
          grace-hours: "22"
          work-job: check
          workflow-file: daily-alerts.yml
          token: ${{ github.token }}

      # load_rules() below reads alerts_config.json from the private data repo.
      - uses: ./.github/actions/load-data
        if: steps.slot.outputs.run == 'true'
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install lightweight deps for schedule check
        if: steps.slot.outputs.run == 'true'
        run: pip install requests

      - id: check
        name: Is any enabled rule due for this slot?
        if: steps.slot.outputs.run == 'true'
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from alerts import load_rules, is_rule_due
          rules = load_rules()
          due = any(r.get("enabled", True) and r.get("conditions") and is_rule_due(r) for r in rules)
          print(f"due={'true' if due else 'false'}")
          EOF

  check:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before the migration restore below, so hashFiles sees the data repo's copy.
      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      # alert_state.json (edge-triggered dedup) is COMMITTED, like
      # weekly_wrapup_state.json. It used to live only in actions/cache, where an
      # eviction, a cache purge or a branch change silently reset it to empty --
      # and the next run then re-fired every currently-true rule x ticker at
      # once. This restore is the one-time migration from that cache: it only
      # runs while the data repo has no alert_state.json yet.
      - name: Restore alert state from the old cache (migration only)
        if: hashFiles('alert_state.json') == ''
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u alert_check.py --force 2>&1 | python -u log_redact.py
          else
            python -u alert_check.py 2>&1 | python -u log_redact.py
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # commit-data skips a file the run didn't write: alert_check.py returns
      # before writing any state when no rule is configured or due.
      - name: Commit updated alert_state.json
        uses: ./.github/actions/commit-data
        with:
          files: alert_state.json
          message: "Update alert_state.json [automated]"
