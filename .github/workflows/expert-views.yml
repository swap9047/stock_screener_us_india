name: Daily Expert Views Generation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Does its work once per 1:00 AM ET slot. First refreshes data_snapshot.json, then
# generates AI Expert Takes for all tickers, so the views always work from same-day
# price data. The slot gate keeps that to one run a day.
on:
  # ONE hourly wake-up, not a cron per DST season. The slot gate below decides
  # whether this run does the work, so a line GitHub never fires (it dropped the
  # 9:15 PM ET alert line on 2026-09-14) or fires 5 h late no longer costs a slot.
  schedule:
    - cron: "0 * * * *"
  # Run manually from the Actions tab anytime, bypasses the gate. `markets`
  # lets the dashboard's "Re-analyze All" button scope a run to just the
  # watchlist(s) behind the tab it was clicked from, instead of always
  # re-running every watchlist. Blank (and every scheduled run) = all.
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated market keys to process (blank = all watchlists)"
        required: false
        default: ""
      limit:
        description: "Analyse only the first N tickers in scope (blank = all). A number, never ticker names: step env is printed in this public repo's logs"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one
  actions: read    # the slot gate reads this workflow's own run history

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: slot
        uses: ./.github/actions/slot-gate
        with:
          slots: "1"
          grace-hours: "22"
          work-job: build
          workflow-file: expert-views.yml
          token: ${{ github.token }}

  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # ~110 tickers x up to 5 LLM calls at a 120s timeout, plus retry
    # pacing. Unbounded, the worst case creeps toward GitHub's 6h cap and
    # is killed AFTER the API spend but BEFORE the commit step.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data snapshot
        shell: bash
        run: python -u refresh_data.py 2>&1 | python -u log_redact.py
        env:
          # Same scoping as the AI step below. Without this the snapshot leg
          # ignored `markets` entirely, so "Re-analyze All" clicked on a
          # 10-ticker tab still refetched all ~118 tickers from Yahoo -- the
          # button's own help text ("this view's watchlist(s) only") was only
          # true of the half of the job that ran after it.
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}

      - name: Generate AI Expert Views
        shell: bash
        run: python -u refresh_expert_views.py 2>&1 | python -u log_redact.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Second key so llm_util.make_client can spread the run's calls
          # across both projects' quotas -- see llm_util's rotation section.
          # Absent/blank is fine: rotation just falls back to one key.
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          # A third key (2026-09-16). Actions only exposes secrets a step names, so
          # each new key needs a line here; llm_util discovers it by name prefix.
          GEMINI_API_KEY_BACKUP_B: ${{ secrets.GEMINI_API_KEY_BACKUP_B }}
          # github.event.inputs (not `inputs`) so scheduled runs, which carry
          # no inputs at all, resolve to an empty string = every watchlist.
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}
          REFRESH_LIMIT: ${{ github.event.inputs.limit }}

      - name: Commit updated data_snapshot.json and expert_views.json
        # always(): commit whatever the run produced even when it failed, so
        # the partial results and any pruning survive for diagnosis.
        if: always()
        uses: ./.github/actions/commit-data
        with:
          files: data_snapshot.json expert_views.json
          message: "Update data_snapshot.json + expert_views.json [automated]"
