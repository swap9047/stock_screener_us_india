name: Daily Expert Views Generation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs once/day at 11:00 PM ET. First refreshes data_snapshot.json (replaces
# the standalone data-refresh workflow), then generates AI Expert Takes for
# all tickers. Running data refresh here ensures expert views always work
# from same-day price data.
#
# 11:00 PM ET is 03:00 UTC during EDT (mid-Mar to early Nov) and 04:00 UTC
# during EST (early Nov to mid-Mar).
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 11:00 PM ET during EDT
    - cron: "0 4 * * *"   # 04:00 UTC = 11:00 PM ET during EST
  # Run manually from the Actions tab anytime, bypasses the gate. `markets`
  # lets the dashboard's "Re-analyze All" button scope a run to just the
  # watchlist(s) behind the tab it was clicked from, instead of always
  # re-running every watchlist. Blank (and every scheduled run) = all.
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated market keys to process (blank = all watchlists)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit expert_views.json back to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        name: Is it ~11 PM ET right now?
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          # 22 hour tolerance for GitHub's scheduler delays.
          import os
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now_et = datetime.now(ZoneInfo("America/New_York"))
          
          rule_hour = 23
          cron = os.environ.get("CRON_SCHEDULE")
          
          # Which of the two crons matches the current DST season is the ONLY
          # question here. There used to be a second condition,
          #     hour_diff = min((h - R) % 24, (R - h) % 24)
          #     due = is_valid_cron and (hour_diff <= 22)
          # billed as a tolerance for scheduler delays -- but that expression is
          # a distance on a 24h circle, so it maxes out at 12 and `<= 22` was
          # unconditionally true. It gated nothing. Deliberately not replaced
          # with a working hour window: GitHub can delay a scheduled run, and
          # skipping the refresh entirely is worse than running it late.
          due = True
          if cron:
              try:
                  cron_utc_hour = int(cron.split()[1])
                  expected_utc_hour = int((rule_hour - (now_et.utcoffset().total_seconds() / 3600)) % 24)
                  due = cron_utc_hour == expected_utc_hour
              except Exception as e:
                  # Was `pass`, which left due=True -- so an unparseable cron
                  # fired BOTH scheduled lines and double-ran ~110 tickers.
                  print(f"# could not parse CRON_SCHEDULE {cron!r}: {e}")
                  due = False
          
          print(f"due={'true' if due else 'false'}")
          EOF

  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    # ~110 tickers x up to 5 LLM calls at a 120s timeout, plus retry
    # pacing. Unbounded, the worst case creeps toward GitHub's 6h cap and
    # is killed AFTER the API spend but BEFORE the commit step.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data snapshot
        run: python -u refresh_data.py
        env:
          # Same scoping as the AI step below. Without this the snapshot leg
          # ignored `markets` entirely, so "Re-analyze All" clicked on a
          # 10-ticker tab still refetched all ~118 tickers from Yahoo -- the
          # button's own help text ("this view's watchlist(s) only") was only
          # true of the half of the job that ran after it.
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}

      - name: Generate AI Expert Views
        run: python -u refresh_expert_views.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # github.event.inputs (not `inputs`) so scheduled runs, which carry
          # no inputs at all, resolve to an empty string = every watchlist.
          REFRESH_MARKETS: ${{ github.event.inputs.markets }}

      - name: Commit updated data_snapshot.json and expert_views.json
        # always(): commit whatever the run produced even when it failed, so
        # the partial results and any pruning survive for diagnosis.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json expert_views.json
          if ! git diff --staged --quiet; then
            git commit -m "Update data_snapshot.json + expert_views.json [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi
