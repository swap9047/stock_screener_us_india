name: Daily Data Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs once/day at ~7:00 AM ET (before market open), fetching all watchlist
# tickers via yfinance and saving the result to data_snapshot.json. The
# Streamlit app reads this snapshot on load instead of hitting yfinance
# live every session -- much faster, and avoids redundant identical fetches
# across visitors. The app's "Refresh Data" button still fetches live data
# on demand regardless of this snapshot.
#
# 7:00 AM ET is 11:00 UTC during EDT and 12:00 UTC during EST -- same
# DST-safe two-cron-line pattern as daily-alerts.yml and news-summary.yml.
# The gate uses a +/-1hr tolerance (6-8 AM ET counts as due) since GitHub's
# scheduler is best-effort and can delay a trigger by over an hour -- see
# alerts.py's is_rule_due() and news-summary.yml's gate for the same fix,
# both added after a real missed run caused by an exact-hour check with no
# grace period.
on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC = 7:15 AM ET during EDT
    - cron: "15 12 * * *"   # 12:15 UTC = 7:15 AM ET during EST
  workflow_dispatch: {}    # run manually from the Actions tab anytime, bypasses the gate

permissions:
  contents: write   # needed to commit data_snapshot.json back to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        name: Is it ~7 AM ET right now?
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now_et = datetime.now(ZoneInfo("America/New_York"))
          
          rule_hour = 7
          cron = os.environ.get("CRON_SCHEDULE")
          
          is_valid_cron = True
          if cron:
              try:
                  cron_utc_hour = int(cron.split()[1])
                  expected_utc_hour = int((rule_hour - (now_et.utcoffset().total_seconds() / 3600)) % 24)
                  if cron_utc_hour != expected_utc_hour:
                      is_valid_cron = False
              except Exception:
                  pass
                  
          hour_diff = min((now_et.hour - rule_hour) % 24, (rule_hour - now_et.hour) % 24)
          due = is_valid_cron and (hour_diff <= 23)
          
          print(f"due={'true' if due else 'false'}")
          EOF

  refresh:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data snapshot
        run: python refresh_data.py

      - name: Commit updated data_snapshot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update data_snapshot.json [automated]"
          git pull --rebase
          git push
