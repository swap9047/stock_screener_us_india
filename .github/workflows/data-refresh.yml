name: Daily Data Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Fetches all watchlist tickers via yfinance and saves the result to
# data_snapshot.json. The Streamlit app reads this snapshot on load instead
# of hitting yfinance live every session -- much faster, and avoids
# redundant identical fetches across visitors. The app's "Refresh Data"
# button still fetches live data on demand regardless of this snapshot.
#
# Refreshes HOURLY, every hour of every day.
#
# This replaces six fixed ET slots (7, 10, 13, 16, 19, 22 ET) selected by a
# gate job. The gate existed only to map those slots onto UTC crons across
# DST -- an hourly cron needs none of that machinery, since every hour fires
# correctly in both seasons and there is no cron pair that could double-fire.
#
# Running around the clock is deliberate, not laziness: India trades roughly
# 23:45-06:00 ET, so the old 7 AM - 11 PM ET window sampled the entire Indian
# session exactly never -- it only ever saw those prices after the close.
#
# Cost is zero (public repo = free Actions minutes), and an idle hour costs
# nothing downstream either: the commit step below skips when the snapshot is
# byte-identical, so hours with no market activity add no commits.
#
# expert-views.yml still refreshes data_snapshot.json before its nightly run,
# so Expert Views always work from same-day data.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}    # run manually from the Actions tab anytime

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit data_snapshot.json back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data snapshot
        run: python -u refresh_data.py

      - name: Commit and push updated data_snapshot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "Update data_snapshot.json [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi
