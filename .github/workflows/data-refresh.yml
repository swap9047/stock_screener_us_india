name: Daily Data Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Fetches all watchlist tickers via yfinance and saves the result to
# data_snapshot.json. The Streamlit app reads this snapshot on load instead
# of hitting yfinance live every session -- much faster, and avoids
# redundant identical fetches across visitors. The app's "Refresh Data"
# button still fetches live data on demand regardless of this snapshot.
#
# Refreshes every 3 hours from 7:00 AM to 11:00 PM ET, Mon-Sat (7, 10, 13,
# 16, 19, 22 ET). Because ET is UTC-4 (EDT) or UTC-5 (EST), the schedule
# fires on a union of UTC hours covering both seasons and a gate keeps only
# the runs whose current ET time lands within a slot. A 6-hour grace window
# past each slot absorbs GitHub's schedule delays (runs can fire minutes to
# hours after the cron time), so a late fire is still honored instead of
# silently dropped. expert-views.yml still refreshes data_snapshot.json
# nightly (~11:00 PM ET) so Expert Views always work from same-day data.
# Workflow_dispatch always bypasses the gate.
on:
  schedule:
    - cron: "0 0,2,3,11,12,14,15,17,18,20,21,23 * * *"
  workflow_dispatch: {}    # run manually from the Actions tab anytime

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit data_snapshot.json back to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        name: Is it an allowed refresh slot right now?
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os
          from zoneinfo import ZoneInfo
          from datetime import datetime
          now_et = datetime.now(ZoneInfo("America/New_York"))

          slots = {7, 10, 13, 16, 19, 22}   # every 3h, 7 AM - 11 PM ET
          grace_h = 6                       # tolerate GitHub schedule delays
          cron = os.environ.get("CRON_SCHEDULE")

          is_valid_cron = True
          if cron:
              try:
                  cron_utc_hours = {int(h) for h in cron.split()[1].split(',')}
                  expected_utc_hours = {int((slot - (now_et.utcoffset().total_seconds() / 3600)) % 24) for slot in slots}
                  if not cron_utc_hours & expected_utc_hours:
                      is_valid_cron = False
              except Exception:
                  pass

          now_minutes = now_et.hour * 60 + now_et.minute
          due = (is_valid_cron and now_et.isoweekday() <= 6 and
                 any(s <= now_minutes < s + grace_h * 60
                     for s in (slot * 60 for slot in slots)))

          print(f"due={'true' if due else 'false'}")
          EOF

  refresh:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data snapshot
        run: python -u refresh_data.py

      - name: Commit and push updated data_snapshot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "Update data_snapshot.json [automated]"
            for i in {1..5}; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 2
              }
            done
          else
            echo "No changes to commit"
          fi
