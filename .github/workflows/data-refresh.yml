name: Daily Data Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Fetches all watchlist tickers via yfinance and saves the result to
# data_snapshot.json. The Streamlit app reads this snapshot on load instead
# of hitting yfinance live every session -- much faster, and avoids
# redundant identical fetches across visitors. The app's "Refresh Data"
# button still fetches live data on demand regardless of this snapshot.
#
# Scheduled every 15 minutes, every hour of every day (owner, 2026-10-15; it was
# hourly). GitHub does not honour that: it throttled the hourly cron to 4-6 runs a
# day, 2-5 hours apart (September 2026, AGENTS.md's GitHub Actions section), and a
# 15-minute cron is only more chances, not a guarantee. Each run that changes the
# ~0.75 MB snapshot is a commit to the data repo, so watch that repo's size.
#
# This replaces six fixed ET slots (7, 10, 13, 16, 19, 22 ET) selected by a
# gate job. The gate existed only to map those slots onto UTC crons across
# DST -- an hourly cron needs none of that machinery, since every hour fires
# correctly in both seasons and there is no cron pair that could double-fire.
#
# Running around the clock is deliberate, not laziness: India trades roughly
# 23:45-06:00 ET, so the old 7 AM - 11 PM ET window sampled the entire Indian
# session exactly never -- it only ever saw those prices after the close.
#
# Cost is zero (public repo = free Actions minutes), and an idle hour costs
# nothing downstream either: the commit step below skips when the snapshot is
# byte-identical, so hours with no market activity add no commits.
#
# expert-views.yml still refreshes data_snapshot.json before its nightly run,
# so Expert Views always work from same-day data.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}    # run manually from the Actions tab anytime

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read   # data is committed to the private data repo, never to this public one

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data snapshot
        shell: bash
        run: python -u refresh_data.py 2>&1 | python -u log_redact.py

      - name: Commit updated data_snapshot.json
        uses: ./.github/actions/commit-data
        with:
          files: data_snapshot.json
          message: "Update data_snapshot.json [automated]"

      # The research library (the transcription app's knowledge graph on Supabase) reads these
      # numbers for its Q&A and for Claude chat -- see publish_market.py. After the commit and
      # never able to fail the run: the snapshot is this workflow's job, the copy is a bonus.
      # psycopg is installed here only, so the app's own requirements.txt stays free of it.
      - name: Publish to the research library
        continue-on-error: true
        shell: bash
        run: |
          pip install --quiet "psycopg[binary]~=3.3"
          python -u publish_market.py screener 2>&1 | python -u log_redact.py
        env:
          MARKET_DB_URL: ${{ secrets.MARKET_DB_URL }}

      # The research library's own companies (the ones no watchlist tracks), hourly: the first refresh
      # in each hour does them, every later one skips (--min-gap, from the database's own timestamps --
      # whichever trigger came first, the Worker's :00/:30 or GitHub's */15). Last, so the snapshot and
      # the screener's rows are never delayed by it, and never able to fail the run. market-library.yml
      # still runs at 7 AM / 5 PM ET as the fallback when nothing runs here.
      - name: Publish the library's companies (hourly)
        continue-on-error: true
        shell: bash
        run: python -u publish_market.py library --min-gap 50 2>&1 | python -u log_redact.py
        env:
          MARKET_DB_URL: ${{ secrets.MARKET_DB_URL }}
