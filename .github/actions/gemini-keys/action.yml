name: Export Gemini keys
description: >
  Put every repository secret whose name starts with GEMINI_API_KEY into the job's environment, so a
  new key needs only its secret (owner, 2026-11-26) -- no line to add to each AI workflow. Actions only
  exposes a secret to a step that names it, except through the `secrets` context itself, which a
  step may serialise (toJSON). The calling job passes that JSON here; ONLY the GEMINI_API_KEY* entries
  leave this step (export_keys.py, stdlib only, prints names and a count, never a value), so the AI
  steps that follow see the keys and nothing else of the secrets context.
inputs:
  secrets:
    description: ${{ toJSON(secrets) }} from the calling job
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ALL_SECRETS: ${{ inputs.secrets }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/export_keys.py"
